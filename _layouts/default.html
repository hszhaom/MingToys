<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 页面标题 SEO -->
  <title>{% if page.title %}{{ page.title | escape }} | PetStorie{% else %}PetStorie - Dog Breed Guides and Pet Care Tips{% endif %}</title>

  <!-- 描述、关键词 SEO -->
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="keywords" content="dog breed, pet stories, pet care, cute dogs, puppy guide, rescue pets">

  <!-- 爬虫规则 + 规范链接（防重复内容） -->
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{% if page.canonical_url %}{{ page.canonical_url }}{% else %}{{ site.url }}{{ page.url }}{% endif %}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.url }}/assets/images/logo.png">

  <!-- 样式文件 -->
  <link rel="stylesheet" href="{{ site.url }}/assets/css/style.css">
</head>
<body>
  {{ content }}
  <script data-goatcounter="https://hszhaom.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
