<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title -->
  <title>{% if page.title %}{{ page.title | escape }} | PetStorie{% else %}PetStorie - Dog Breed Guides and Pet Care Tips{% endif %}</title>

  <!-- Page description -->
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">

  <!-- Crawling and canonical URL -->
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{% if page.canonical_url %}{{ page.canonical_url }}{% else %}{{ site.url }}{{ page.url }}{% endif %}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:url" content="{% if page.canonical_url %}{{ page.canonical_url }}{% else %}{{ site.url }}{{ page.url }}{% endif %}">
  <meta property="og:image" content="{% if page.cover %}{{ site.url }}{{ page.cover }}{% else %}{{ site.url }}/assets/images/logo.png{% endif %}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="twitter:image" content="{% if page.cover %}{{ site.url }}{{ page.cover }}{% else %}{{ site.url }}/assets/images/logo.png{% endif %}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.url }}/assets/images/logo.png">

  <!-- Google AdSense Auto ads -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1296126560310042"
     crossorigin="anonymous"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ site.url }}/assets/css/style.css">

  {% unless page.url == "/" %}
  <!-- Google structured data: Breadcrumbs -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "{{ site.url }}/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": {{ page.title | default: site.title | jsonify }},
        "item": "{% if page.canonical_url %}{{ page.canonical_url }}{% else %}{{ site.url }}{{ page.url }}{% endif %}"
      }
    ]
  }
  </script>
  {% endunless %}

  {% if page.faq_schema %}
  <!-- Google structured data: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {% for item in page.faq_schema %}
      {
        "@type": "Question",
        "name": {{ item.question | jsonify }},
        "acceptedAnswer": {
          "@type": "Answer",
          "text": {{ item.answer | jsonify }}
        }
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
  </script>
  {% endif %}
</head>
<body>
  {{ content }}
  {% if page.faq_schema %}
  <section class="container schema-faq" aria-labelledby="faq-title">
    <div class="topic-page faq-panel">
      <h2 id="faq-title">FAQ</h2>
      {% for item in page.faq_schema %}
      <section class="faq-item">
        <h3>{{ item.question }}</h3>
        <p>{{ item.answer }}</p>
      </section>
      {% endfor %}
    </div>
  </section>
  {% endif %}
  {% include site_footer.html %}
  <script data-goatcounter="https://hszhaom.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

  <!-- GoatCounter visible visitor counts. Fail silently so it does not affect rendering. -->
  <script>
  (function () {
    var base = 'https://hszhaom.goatcounter.com/counter/';
    document.querySelectorAll('[data-gc-count]').forEach(function (el) {
      var path = el.getAttribute('data-gc-count');
      var url = base + (path === 'TOTAL' ? 'TOTAL' : encodeURIComponent(path)) + '.json';
      fetch(url).then(function (r) { return r.json(); }).then(function (d) {
        var pv = el.querySelector('.gc-pv'), uv = el.querySelector('.gc-uv');
        if (pv) pv.textContent = d.count;
        if (uv) uv.textContent = d.count_unique;
      }).catch(function () {});
    });
  })();
  </script>
</body>
</html>
