---
layout: default
---
{% include header.html %}

<div class="container">
  <div class="post-page">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      Publish on: {{ page.date | date: "%B %d, %Y" }}
      <span data-gc-count="{{ page.url }}" style="margin-left: 1rem;">
        Page Views: <span class="gc-pv">â€?/span>
      </span>
    </div>
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</div>

<footer>
  &copy; {{ site.time | date: '%Y' }} {{ site.title }} | All rights reserved
  <span data-gc-count="TOTAL" style="margin-left: 1rem;">
    Visitors: <span class="gc-uv">â€?/span> Â· Total Views: <span class="gc-pv">â€?/span>
  </span>
</footer>

<!-- Google ç»“æž„åŒ–æ•°æ?Article -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "image": {{ site.url | append: page.cover | jsonify }},
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
  "dateModified": "{{ page.date | date: '%Y-%m-%d' }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{% if page.canonical_url %}{{ page.canonical_url }}{% else %}{{ site.url }}{{ page.url }}{% endif %}"
  },
  "description": {{ page.description | default: page.excerpt | strip_html | truncate: 160 | jsonify }},
  "author": {
    "@type": "Organization",
    "name": "PetStorie"
  },
  "publisher": {
    "@type": "Organization",
    "name": "PetStorie",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}/assets/images/logo.png"
    }
  }
}
</script>
