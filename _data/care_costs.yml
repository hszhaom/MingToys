name: "PetStorie Care & Cost Dataset"
updated: "2026-10-26"
method: "editorial synthesis"
review_status: "not professionally reviewed"
items:
  financial_protection:
    name: "Pet-insurance premiums or emergency savings contributions"
    frequency: "Monthly planning choice"
    region: "United States planning context; policy terms, quotes and savings goals are local and individual"
    dog_scope: "Any size or life stage; premiums and coverage can vary with the dog, location and policy"
    minimum: null
    maximum: null
    qualitative_range: "No universal premium or savings-target range established; the calculator's existing ranges are editorial assumptions, not quotes or coverage promises"
    currency: "USD"
    baseline_year: 2026
    includes: "Either an estimated insurance premium or a household contribution set aside for unexpected veterinary costs"
    excludes: "Claim payments, deductibles, coinsurance, reimbursement, policy limits, actual treatment costs and a promise that savings cover an event"
    calculation: "Choose one primary monthly planning path. A premium is billed spending; a savings contribution remains the owner's money and is not an invoice. The calculator does not estimate claim reimbursement or actual out-of-pocket care."
    confidence: "Moderate for questions to ask; low for dollar assumptions because no local quote dataset is available"
    editorial_note: "This is an editorial synthesis, not insurance advice or a policy comparison. Read the exact policy and obtain a quote for the individual dog. The two choices must not be added together as though both are recurring service charges."
    accessed: "2026-10-26"
    sources:
      - organization: "Maryland Insurance Administration"
        title: "Pet Insurance"
        url: "https://insurance.maryland.gov/Consumer/Pages/pet-insurance.aspx"
        accessed: "2026-10-26"
        supports: "Policies can have deductibles, reimbursement limits, exclusions and premiums that vary by coverage, breed and deductible; owners commonly pay the clinic before seeking reimbursement."
      - organization: "California Department of Insurance"
        title: "Questions to Consider When Purchasing Pet Insurance"
        url: "https://www.insurance.ca.gov/01-consumers/105-type/8-pet/pet-qa.cfm"
        accessed: "2026-10-26"
        supports: "Compare waiting periods, exclusions, deductibles, coinsurance, limits, renewal pricing and the reimbursement basis before relying on a policy."
  paid_dog_walks:
    name: "Optional paid dog walks"
    frequency: "Per visit, converted to annual cost and a monthly average"
    region: "United States calculator; a local USD quote is required"
    dog_scope: "Any size or life stage; suitability, visit length and frequency must be agreed for the individual dog"
    minimum: null
    maximum: null
    qualitative_range: "No market price range established; the reader supplies lower and upper quotes for the same service"
    currency: "USD"
    baseline_year: 2026
    includes: "Quoted visits at the entered weekly frequency and number of paid weeks"
    excludes: "Daycare, boarding, extra travel, holiday surcharges, cancellation fees and other charges unless included in the quoted visit price"
    calculation: "Annual = price per visit × visits per paid week × paid weeks per year; monthly average = annual ÷ 12"
    confidence: "Moderate for general care-planning context; local prices and suitability are unverified"
    editorial_note: "UK welfare guidance and US sitter guidance support planning and handoff questions, not local prices or regulations. Zero cost does not establish adequate care. Input limits are calculator limits, not recommended prices or visit frequencies. Existing base-care allowances remain separate, unvalidated assumptions. The cancellation scenario is an editorial worksheet, not a documented owner case or validated care assessment."
    accessed: "2026-10-22"
    sources:
      - organization: "Dogs Trust"
        title: "Getting a dog when working full time"
        url: "https://www.dogstrust.org.uk/dog-advice/getting-dog/dog-ready/getting-a-dog-full-time-job"
        accessed: "2026-10-22"
        supports: "Budget for care while away and plan for changes in informal support"
      - organization: "Dogs Trust"
        title: "How to find a good dog walker"
        url: "https://www.dogstrust.org.uk/dog-advice/life-with-your-dog/outdoors/find-dog-walker"
        accessed: "2026-10-22"
        supports: "Agree timing, equipment, emergency contacts, individual needs and cancellation arrangements"
      - organization: "American Animal Hospital Association"
        title: "Preparing for the Unexpected: Essential Pet Sitter Instructions"
        url: "https://www.aaha.org/resources/preparing-for-the-unexpected-essential-pet-sitter-instructions/"
        accessed: "2026-10-22"
        supports: "Record the dog's routine, access arrangements, veterinary contacts and nearby backup support"
    cancellation_checks:
      - question: "Who can actually arrive?"
        action: "Write the backup person's accepted arrival time beside the dog's next care task. Include travel time and a second contact. A message sent is not an accepted handoff."
      - question: "Can that person carry out the care?"
        action: "Rehearse access, equipment and the agreed routine before relying on the backup. Keep keys, access codes and personal contacts in a private handoff sheet, not on this website."
      - question: "What is still payable?"
        action: "Ask the original provider about cancellation charges or credits and the replacement about their full fee. Record both separately until the actual charges are confirmed."
      - question: "Who confirms completion and the next handoff?"
        action: "Record arrival, completed tasks and who takes over if the owner returns late. Keep current veterinary directions and clinic contacts available; ask a licensed veterinarian about health-related care changes."
    care_plan:
      - frequency: "Daily"
        action: "Confirm today's handoff and return. Keep feeding, toilet breaks and other care assigned outside the paid visit."
      - frequency: "Weekly"
        action: "Match booked visits to the actual work calendar. Arrange backup cover for absences, delays or cancellations."
      - frequency: "Monthly"
        action: "Compare invoices with the monthly average and check extra charges; review whether the arrangement is working for the dog."
      - frequency: "Annual or when circumstances change"
        action: "Refresh quotes, paid weeks, provider details and emergency contacts. Revisit the arrangement when the dog's age, health or behavior changes."
